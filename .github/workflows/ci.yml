# badge: https://github.com/borgbackup/borg-mcp/workflows/CI/badge.svg?branch=master

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/ruff-action@v4.1.0

  tests:

    needs: [lint]
    strategy:
      fail-fast: true
      matrix:
        include:
          - python-version: '3.11'
            toxenv: py311
          - python-version: '3.11'
            toxenv: mypy
          - python-version: '3.15'
            toxenv: py315
    env:
      TOXENV: ${{ matrix.toxenv }}

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        # Just fetching one commit is not enough for setuptools-scm, so we fetch all.
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python 3.11 for borg2
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install borg2 build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config build-essential libssl-dev libacl1-dev

    - name: Install borg2 from GitHub master
      # borg-mcp drives the borg CLI, so borg2 can live in its own (3.11) environment,
      # independent of the Python version borg-mcp is tested on.
      run: |
        python3.11 -m pip install --upgrade pip
        python3.11 -m pip install "borgbackup @ git+https://github.com/borgbackup/borg.git"
        echo "BORG_MCP_TEST_BORG=$(which borg)" >> $GITHUB_ENV
        borg --version

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: run tox env
      run: tox
